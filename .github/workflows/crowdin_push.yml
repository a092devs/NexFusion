name: Crowdin push sources

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'app/src/main/res/values/strings.xml'
  workflow_dispatch:

jobs:
  push:
    name: Upload strings to Crowdin
    runs-on: ubuntu-latest
    steps:
      - name: Check Crowdin credentials
        id: check_auth
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -z "$CROWDIN_PROJECT_ID" ] || [ -z "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "Crowdin credentials (CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN) are not configured. Skipping Crowdin operations."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_auth.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Upload sources to Crowdin
        if: steps.check_auth.outputs.configured == 'true'
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
