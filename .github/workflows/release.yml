name: Android Release CI

on:
    push:
        tags:
            - '*.*.*'

    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag, X.Y.Z or X.Y.Z-suffix for a pre-release'
                required: true
                type: string
            delete:
                description: 'Delete releases and tags whose tag contains this text, e.g. -alpha'
                required: false
                type: string

permissions:
    contents: write

concurrency:
    group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    cancel-in-progress: false

env:
    TAG: ${{ inputs.tag || github.ref_name }}

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout source
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up JDK
              uses: actions/setup-java@v5
              with:
                  java-version: '21'
                  distribution: temurin
                  cache: gradle

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4
              with:
                  packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Configure Gradle timeouts
              run: echo "GRADLE_OPTS=-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000" >> $GITHUB_ENV

            - name: Validate version and release tag
              shell: bash
              env:
                  RELEASE_TAG: ${{ env.TAG }}
              run: |
                  set -euo pipefail
                  if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
                    echo "::error::Invalid release tag format: $RELEASE_TAG"
                    exit 1
                  fi
                  app_version="$(grep '^appVersionName=' gradle.properties | cut -d'=' -f2)"
                  if [[ -n "$app_version" && "$RELEASE_TAG" != "$app_version"* ]]; then
                    echo "::error::Conflicting version assignment: release tag $RELEASE_TAG does not match manager app versionName $app_version in gradle.properties"
                    exit 1
                  fi


            - name: Prepare signing
              shell: bash
              env:
                  KEYSTORE: ${{ secrets.KEYSTORE }}
                  STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
                  ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
                  EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
                  RELEASE_TAG: ${{ env.TAG }}
              run: |
                  set -euo pipefail

                  echo "DEBUG_SIGNED=false" >> "$GITHUB_ENV"

                  if [[ -z "$KEYSTORE" ]]; then
                    if [[ "$RELEASE_TAG" != *-* ]]; then
                      echo "::error::Stable releases require signing secrets."
                      echo "::error::Configure KEYSTORE, KEYSTORE_PASSWORD, KEYSTORE_ALIAS and KEYSTORE_ALIAS_PASSWORD in repository Actions secrets."
                      exit 1
                    fi

                    echo "::warning::Signing secrets are missing. This pre-release will use the debug key."
                    echo "DEBUG_SIGNED=true" >> "$GITHUB_ENV"
                    exit 0
                  fi

                  if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$ALIAS_PASSWORD" ]]; then
                    echo "::error::One or more signing secrets are missing."
                    exit 1
                  fi

                  printf '%s' "$KEYSTORE" | base64 --decode > key.jks

                  {
                    printf 'KEYSTORE_PASSWORD=%s\n' "$STORE_PASSWORD"
                    printf 'KEYSTORE_ALIAS=%s\n' "$KEY_ALIAS"
                    printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$ALIAS_PASSWORD"
                    printf 'KEYSTORE_FILE=../key.jks\n'
                  } > signing.properties

                  test -s key.jks

                  keytool -list \
                    -keystore key.jks \
                    -storepass "$STORE_PASSWORD" \
                    -alias "$KEY_ALIAS" >/dev/null

                  if [[ -n "${EXPECTED_CERT_SHA256:-}" ]]; then
                    actual_cert_sha256="$(keytool -list -v \
                      -keystore key.jks \
                      -storepass "$STORE_PASSWORD" \
                      -alias "$KEY_ALIAS" |
                      sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' |
                      tr -d ':' |
                      tr '[:lower:]' '[:upper:]' |
                      head -n1)"
                    expected_cert_sha256="$(printf '%s' "$EXPECTED_CERT_SHA256" |
                      tr -d ': ' |
                      tr '[:lower:]' '[:upper:]')"
                    if [[ "$actual_cert_sha256" != "$expected_cert_sha256" ]]; then
                      echo "::error::Release certificate fingerprint does not match RELEASE_CERT_SHA256."
                      exit 1
                    fi
                    echo "Release certificate fingerprint verified."
                  else
                    echo "::warning::RELEASE_CERT_SHA256 is not configured; certificate identity was not pinned."
                  fi

                  echo "Keystore and alias verified."

            - name: Build module and patcher API
              shell: bash
              run: |
                  set -euo pipefail

                  ./gradlew \
                    :app:assembleRelease \
                    :app:assembleDebug \
                    :patcher:publishAllPublicationsToReleaseRepository \
                    --no-configuration-cache
                  ./gradlew -p build-logic \
                    publishAllPublicationsToReleaseRepository \
                    --no-configuration-cache

            - name: Generate release notes
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ env.TAG }}
              run: |
                  set -euo pipefail

                  # Prefer the curated section for this tag from CHANGELOG.md and fall back to the
                  # generated commit notes when the changelog has no section for the tag yet.
                  section=""
                  if [[ -f CHANGELOG.md ]]; then
                    section="$(awk -v tag="$RELEASE_TAG" '
                      /^## / {
                        if (found) exit
                        rest = substr($0, 4)
                        sub(/[ \t].*$/, "", rest)
                        if (rest == tag) found = 1
                        next
                      }
                      found { print }
                    ' CHANGELOG.md)"
                  fi

                  if [[ -n "${section//[[:space:]]/}" ]]; then
                    printf '%s\n' "$section" > release-notes.md
                  else
                    gh api \
                      "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                      -f "tag_name=$RELEASE_TAG" \
                      -f "target_commitish=$GITHUB_SHA" \
                      --jq '.body' > release-notes.md
                  fi

                  if [[ "${DEBUG_SIGNED:-false}" == "true" ]]; then
                    {
                      printf '\n\n'
                      printf '> [!WARNING]\n'
                      printf '> This APK is signed with a debug key. Uninstall it before installing a later release signed with a different key.\n'
                    } >> release-notes.md
                  fi

            - name: Create release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ env.TAG }}
              run: |
                  set -euo pipefail

                  mkdir -p release

                  APK_RELEASE="app/build/outputs/apk/release/app-release.apk"
                  APK_DEBUG="app/build/outputs/apk/debug/app-debug.apk"

                  if [[ ! -f "$APK_RELEASE" ]]; then
                    echo "::error::Release APK not found at $APK_RELEASE"
                    exit 1
                  fi

                  cp "$APK_RELEASE" "release/NexFusion-${RELEASE_TAG}.apk"
                  RELEASE_ASSETS=("release/NexFusion-${RELEASE_TAG}.apk")
                  if [[ -f "$APK_DEBUG" ]]; then
                    cp "$APK_DEBUG" "release/NexFusion-${RELEASE_TAG}-debug.apk"
                    RELEASE_ASSETS+=("release/NexFusion-${RELEASE_TAG}-debug.apk")
                  fi

                  RELEASE_ARGS=(
                    "$RELEASE_TAG"
                    "${RELEASE_ASSETS[@]}"
                    --target "$GITHUB_SHA"
                    --title "$RELEASE_TAG"
                    --notes-file release-notes.md
                  )

                  if [[ "$RELEASE_TAG" == *-* ]]; then
                    RELEASE_ARGS+=(--prerelease)
                  fi

                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "Release $RELEASE_TAG already exists; uploading assets."
                    gh release upload "$RELEASE_TAG" "${RELEASE_ASSETS[@]}" --clobber
                  else
                    gh release create "${RELEASE_ARGS[@]}"
                  fi

            - name: Publish to Xposed Modules Repo
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
                  RELEASE_TAG: ${{ env.TAG }}
              run: |
                  set -euo pipefail

                  if [[ -z "${GH_TOKEN:-}" ]]; then
                    echo "::warning::XPOSED_REPO_TOKEN is not configured; skipping automatic Xposed Modules Repo release."
                    exit 0
                  fi

                  if [[ "$RELEASE_TAG" == *-* ]]; then
                    echo "Skipping Xposed Modules Repo publish for pre-release $RELEASE_TAG"
                    exit 0
                  fi

                  XPOSED_REPO="Xposed-Modules-Repo/io.github.a092devs.nexfusion"
                  CODE=$(grep '^appVersionCode=' gradle.properties | cut -d'=' -f2)
                  XPOSED_TAG="${CODE}-${RELEASE_TAG}"
                  echo "Publishing release $RELEASE_TAG to $XPOSED_REPO with tag $XPOSED_TAG"

                  ASSETS=("release/NexFusion-${RELEASE_TAG}.apk")
                  if [[ -f "release/NexFusion-${RELEASE_TAG}-debug.apk" ]]; then
                    ASSETS+=("release/NexFusion-${RELEASE_TAG}-debug.apk")
                  fi

                  if gh release view "$XPOSED_TAG" --repo "$XPOSED_REPO" >/dev/null 2>&1; then
                    echo "Release $XPOSED_TAG already exists on $XPOSED_REPO; uploading assets."
                    gh release upload "$XPOSED_TAG" "${ASSETS[@]}" --repo "$XPOSED_REPO" --clobber
                  else
                    gh release create "$XPOSED_TAG" "${ASSETS[@]}" \
                      --repo "$XPOSED_REPO" \
                      --title "$RELEASE_TAG" \
                      --notes-file release-notes.md
                  fi

            - name: Publish to Telegram
              if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
              shell: bash
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  RELEASE_TAG: ${{ env.TAG }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  python3 - <<'PY'
                  import html, mimetypes, os, re, sys, urllib.error, urllib.parse, urllib.request, uuid

                  token = os.environ["TELEGRAM_BOT_TOKEN"]
                  chat_id = os.environ["TELEGRAM_CHAT_ID"]
                  tag = os.environ["RELEASE_TAG"]
                  repo = os.environ["REPO"]

                  notes = ""
                  if os.path.exists("release-notes.md"):
                      with open("release-notes.md", "r", encoding="utf-8") as f:
                          notes = f.read()

                  notes = re.sub(r"<!--.*?-->", "", notes, flags=re.S).strip()
                  lines = []
                  for raw in notes.splitlines():
                      s = raw.strip()
                      if not s:
                          lines.append("")
                          continue
                      esc = html.escape(s)
                      esc = re.sub(r"^#{1,6}\s+(.+)$", r"<b>\1</b>", esc)
                      esc = re.sub(r"^\s*[-*]\s+", "• ", esc)
                      esc = re.sub(r"\*\*(.+?)\*\*", r"<b>\1</b>", esc)
                      esc = re.sub(r"`([^`]+)`", r"<code>\1</code>", esc)
                      lines.append(esc)

                  body = "\n".join(lines).strip()
                  header = f"🚀 <b>NexFusion {html.escape(tag)} Released</b>\n"
                  footer = f"\n\n🔗 <a href=\"https://github.com/{repo}/releases/tag/{urllib.parse.quote(tag)}\">GitHub Release</a>"
                  max_body = 4096 - len(header) - len(footer) - 20
                  if len(body) > max_body:
                      body = body[:max_body].rstrip() + "\n…"
                  text = f"{header}\n{body}{footer}" if body else f"{header}{footer.strip()}"

                  payload = urllib.parse.urlencode({
                      "chat_id": chat_id,
                      "text": text,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": "true",
                  }).encode("utf-8")
                  req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          print("sendMessage:", resp.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      print("Telegram sendMessage failed:", e.code, e.read().decode("utf-8", errors="replace"), file=sys.stderr)
                      raise

                  def send_document(path, caption):
                      if not os.path.isfile(path):
                          print(f"Skipping missing asset: {path}")
                          return
                      boundary = f"----NexFusionBoundary{uuid.uuid4().hex}"
                      parts = []
                      for k, v in [("chat_id", chat_id), ("caption", caption), ("parse_mode", "HTML")]:
                          parts.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"{k}\"\r\n\r\n{v}\r\n".encode("utf-8"))
                      filename = os.path.basename(path)
                      ctype = mimetypes.guess_type(filename)[0] or "application/octet-stream"
                      with open(path, "rb") as f:
                          file_bytes = f.read()
                      parts.append(
                          f"--{boundary}\r\nContent-Disposition: form-data; name=\"document\"; filename=\"{filename}\"\r\nContent-Type: {ctype}\r\n\r\n".encode("utf-8")
                          + file_bytes
                          + f"\r\n--{boundary}--\r\n".encode("utf-8")
                      )
                      body_bytes = b"".join(parts)
                      doc_req = urllib.request.Request(
                          f"https://api.telegram.org/bot{token}/sendDocument",
                          data=body_bytes,
                          headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
                      )
                      try:
                          with urllib.request.urlopen(doc_req, timeout=120) as resp:
                              print(f"sendDocument ({filename}):", resp.read().decode("utf-8"))
                      except urllib.error.HTTPError as e:
                          print(f"Telegram sendDocument ({filename}) failed:", e.code, e.read().decode("utf-8", errors="replace"), file=sys.stderr)
                          raise

                  send_document(f"release/NexFusion-{tag}.apk", f"<b>NexFusion {html.escape(tag)}</b> (Release)")
                  send_document(f"release/NexFusion-{tag}-debug.apk", f"<b>NexFusion {html.escape(tag)}</b> (Debug)")
                  PY

            # External patch bundles use:
            # https://raw.githubusercontent.com/<owner>/<repo>/maven
            - name: Publish patcher API to the maven branch
              shell: bash
              env:
                  RELEASE_TAG: ${{ env.TAG }}
              run: |
                  set -euo pipefail

                  if [[ ! -d build/maven ]]; then
                    echo "::error::Maven artifacts were not found in build/maven."
                    find . -type f -name 'maven-metadata.xml' -print
                    exit 1
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git fetch origin maven || true

                  if git show-ref --verify --quiet refs/remotes/origin/maven; then
                    git worktree add maven-repo origin/maven
                  else
                    git worktree add --detach maven-repo
                    git -C maven-repo checkout --orphan maven
                    git -C maven-repo rm -rfq . || true
                  fi

                  cp -r build/maven/. maven-repo/

                  git -C maven-repo add -A

                  if git -C maven-repo diff --cached --quiet; then
                    echo "Maven repository has no changes."
                    exit 0
                  fi

                  git -C maven-repo commit -m "Publish patcher API from $RELEASE_TAG"
                  git -C maven-repo push origin HEAD:maven

            - name: Delete superseded releases
              if: ${{ inputs.delete != '' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PATTERN: ${{ inputs.delete }}
                  RELEASE_TAG: ${{ env.TAG }}
              run: |
                  set -euo pipefail

                  gh release list \
                    --limit 200 \
                    --json tagName \
                    --jq '.[].tagName' > tags

                  while IFS= read -r OLD_TAG; do
                    [[ -z "$OLD_TAG" ]] && continue
                    [[ "$OLD_TAG" == "$RELEASE_TAG" ]] && continue

                    if [[ "$OLD_TAG" == *"$PATTERN"* ]]; then
                      echo "Deleting superseded release: $OLD_TAG"
                      gh release delete "$OLD_TAG" --cleanup-tag --yes
                    fi
                  done < tags

            - name: Clean up signing files
              if: always()
              run: rm -f key.jks signing.properties release-notes.md tags
