name: Android CI

on:
  push:
    branches: [ "main", "beta" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 10

    - name: Check duplicate push on beta
      id: check-duplicate
      if: github.ref == 'refs/heads/beta'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git fetch origin main --depth=10
        MAIN_SHA="$(git rev-parse FETCH_HEAD 2>/dev/null || true)"
        if [[ -n "$MAIN_SHA" ]] && git merge-base --is-ancestor "$GITHUB_SHA" "$MAIN_SHA"; then
          echo "Commit $GITHUB_SHA is already on main; cancelling duplicate workflow run on beta."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          gh run cancel "$GITHUB_RUN_ID" || true
          exit 0
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: set up JDK
      if: steps.check-duplicate.outputs.skip != 'true'
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      if: steps.check-duplicate.outputs.skip != 'true'
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Grant execute permission for gradlew
      if: steps.check-duplicate.outputs.skip != 'true'
      run: chmod +x gradlew

    - name: Write key
      if: steps.check-duplicate.outputs.skip != 'true' && github.event_name != 'pull_request'
      run: |
        if [ -z "${{ secrets.KEYSTORE }}" ]; then
          echo "::warning::Signing secrets are missing, the release APK is not built. Add KEYSTORE (base64), KEYSTORE_PASSWORD, KEYSTORE_ALIAS and KEYSTORE_ALIAS_PASSWORD in Settings > Secrets and variables > Actions."
          exit 0
        fi
        echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
        echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
        echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
        echo KEYSTORE_FILE=../key.jks >> signing.properties
        echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks

    - name: Unit tests
      if: steps.check-duplicate.outputs.skip != 'true' && github.ref != 'refs/heads/main'
      run: ./gradlew testDebugUnitTest

    - name: Build modules
      if: steps.check-duplicate.outputs.skip != 'true'
      run: |
        if [ -f signing.properties ]; then
          ./gradlew :app:assembleDebug :app:assembleRelease
        else
          ./gradlew :app:assembleDebug
        fi

    - name: Prepare APKs
      if: steps.check-duplicate.outputs.skip != 'true'
      run: |
        mkdir -p dist-apk
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/NexFusion-debug.apk
        fi
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          cp app/build/outputs/apk/release/app-release.apk dist-apk/NexFusion-release.apk
        fi

    - name: Upload module
      if: steps.check-duplicate.outputs.skip != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: NexFusion-APKs
        path: dist-apk/*.apk
        if-no-files-found: error

    - name: Create AutoBuild Release
      if: steps.check-duplicate.outputs.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        GIT_DESCRIBE=$(git rev-parse --short HEAD)
        mkdir autobuild
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          cp app/build/outputs/apk/release/app-release.apk autobuild/NexFusion-${GIT_DESCRIBE}.apk
        fi
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          cp app/build/outputs/apk/debug/app-debug.apk autobuild/NexFusion-${GIT_DESCRIBE}-debug.apk
        fi

        # Extract only the latest version changelog (excluding older versions)
        section=""
        if [[ -f CHANGELOG.md ]]; then
          section="$(awk '
            /^## / {
              if (found) exit
              found = 1
              print
              next
            }
            found { print }
          ' CHANGELOG.md)"
        fi

        notes_file="autobuild/notes.md"
        if [[ -n "${section//[[:space:]]/}" ]]; then
          printf '%s\n' "$section" > "$notes_file"
        else
          echo "Nightly build from commit ${GIT_DESCRIBE}." > "$notes_file"
        fi

        gh release delete autobuild --cleanup-tag --yes || true
        gh release create autobuild autobuild/*.apk \
          --prerelease \
          --target "${{ github.sha }}" \
          --title "Nightly Build ${GIT_DESCRIBE}" \
          --notes-file "$notes_file"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish Artifact Notice
      if: steps.check-duplicate.outputs.skip != 'true'
      run: |
        echo "## 📦 Standalone APK Downloads" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> **Note:** GitHub Actions packages runtime artifacts in the table above into a `.zip` archive by default." >> $GITHUB_STEP_SUMMARY
        echo "> To download the direct standalone **`.apk`** files without zip packaging, visit the **[Releases](https://github.com/${{ github.repository }}/releases)** page." >> $GITHUB_STEP_SUMMARY

  auto-release:
    name: Auto release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    concurrency:
      group: auto-release
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v7

    - name: Dispatch release workflow for the current version
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        CODE=$(grep '^appVersionCode=' gradle.properties | cut -d'=' -f2)
        NAME=$(grep '^appVersionName=' gradle.properties | cut -d'=' -f2)
        VERSION="${NAME}"
        echo "Resolved release version: $VERSION"

        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
          echo "::error::Could not resolve a release version from gradle.properties (got '$VERSION')."
          exit 1
        fi

        if gh release view "$VERSION" >/dev/null 2>&1; then
          echo "Release $VERSION already exists; nothing to release."
          exit 0
        fi

        gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$VERSION"
        echo "Dispatched the release workflow for $VERSION."
