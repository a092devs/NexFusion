name: Release

on:
  push:
    tags:
      - '*'

concurrency:
  group: nxb-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build bundle
        run: ./gradlew :bundle:assembleBundle

      # NexFusion installs every .nxb asset of the latest release of a source repository.
      - name: Create release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; nothing to publish."
            exit 0
          fi
          gh release create "${{ github.ref_name }}" bundle/build/outputs/bundle/*.nxb --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
