org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Maven repository of the NexFusion patcher API, and the version to compile against.
nexfusionMaven=https://raw.githubusercontent.com/a092devs/NexFusion/maven
patcherVersion=2.0.0
# PATCHER_API_VERSION of that patcher version; NexFusion refuses bundles built against a newer API.
patcherApiVersion=1
