[versions]
composeBom = "2026.06.01"
activityCompose = "1.12.3"
lifecycle = "2.10.0"
navigationCompose = "2.10.0"
work = "2.11.1"
kotlinCompose = "2.2.10"
dexlib2 = "3.0.9"
agp = "9.2.1"
dexkit = "2.3.0"
xposed = "82"
libxposed = "102.0.0"
annotation = "1.10.0"
gson = "2.14.0"
kotlinxCoroutinesAndroid = "1.11.0"
junit = "6.1.0"
flatbuffers = "23.5.26"
lang3 = "3.20.0"
miuix = "0.9.1"
# Transitive dependency of miuix-ui; declared explicitly so palette generation can use it.
materialKolor = "4.1.1"




[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
dexlib2 = { group = "com.android.tools.smali", name = "smali-dexlib2", version.ref = "dexlib2" }
dexkit = { group = "org.luckypray", name = "dexkit", version.ref = "dexkit" }
xposed = { group = "de.robv.android.xposed", name = "api", version.ref = "xposed" }
libxposed-api = {group = "io.github.libxposed", name = "api", version.ref = "libxposed"}
libxposed-service = {group = "io.github.libxposed", name = "service", version.ref = "libxposed"}
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
flatbuffers = { group = "com.google.flatbuffers", name = "flatbuffers-java", version.ref = "flatbuffers" }
lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "lang3" }
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui", version.ref = "miuix" }
miuix-blur = { group = "top.yukonga.miuix.kmp", name = "miuix-blur", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference", version.ref = "miuix" }
material-kolor-utilities = { group = "com.materialkolor", name = "material-color-utilities", version.ref = "materialKolor" }


[plugins]
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinCompose" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
